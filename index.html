    <!-- Merlin Chatbot Integration -->
    <script>
        // Todo botão de orçamento (data-merlin ou id cta-merlinN) abre o bot de WhatsApp da Merlin.
        // A escuta fica no documento, então vale também para os botões que o React monta depois,
        // ao trocar de página sem recarregar. Sem o bot na tela (não carregou, bloqueador, escondido
        // por filtro de anúncio), o clique segue o próprio link, que leva ao WhatsApp comercial.
        document.addEventListener('click', function (evento) {
            if (evento.button !== 0 || evento.ctrlKey || evento.metaKey || evento.shiftKey || evento.altKey) return;
            var alvo = evento.target instanceof Element ? evento.target.closest('[data-merlin], [id^="cta-merlin"]') : null;
            if (!alvo) return;
            var bot = document.querySelector('.merlin-button');
            if (!bot || !bot.getClientRects().length) return;
            evento.preventDefault();
            // Duplo clique: o segundo clique fecharia o chat que o primeiro abriu
            if (evento.detail > 1) return;
            bot.click();
        });

        function iniciarMerlin() {
            try {
                Merlin.Popup.initFromSource("https://tools.gomerlin.com.br/popup/347fd9a8-e4e3-4325-b9af-9619f19fdd92");
            } catch (erro) {
                // merlin.js veio quebrado: os botões caem no link do WhatsApp
            }
        }
    </script>
    <!-- async: o site aparece sem esperar o servidor da Merlin; o bot entra quando chegar -->
    <script async src='https://scripts.gomerlin.com.br/merlin.js' onload="iniciarMerlin()"></script>
